<style>
:root{
  --bg:#f1ece1; --surface:#faf7f0; --raise:#ffffff; --ink:#1b1922; --muted:#6c675b; --rule:#d9d1bf;
  --brass:#8d6a1b; --brass-soft:#ead9ae; --brass-ink:#5a4310; --ok:#2e5d3a; --ok-soft:#d3e5d4; --skip:#8a3a2e; --skip-soft:#efd6d0;
  --font-display:'Bebas Neue','Oswald','Impact',sans-serif; --font-body:'Instrument Sans','Helvetica Neue',sans-serif; --font-mono:'DM Mono',Menlo,monospace;
  --r:10px; --tab-h:64px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}}
:root[data-theme="dark"]{
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.45;padding-inline:16px;padding-block:0 calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--brass-ink)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:normal}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:10px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule)}
.top h1{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.03em;line-height:1}
.top h1 em{font-style:normal;color:var(--brass)}
.top .clock{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.3}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 4px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:6px 11px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--brass-soft);color:var(--brass-ink);border-color:var(--brass-soft)}
.chip b{font-family:var(--font-display);font-size:1rem;letter-spacing:.04em;margin-right:4px;color:inherit;font-weight:normal}
section.view{display:none;padding-top:6px} section.view.on{display:block}
.eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.h2{font-family:var(--font-display);font-size:2rem;letter-spacing:.02em;line-height:1;margin:14px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-style:italic}

/* hero (up next) */
.hero{background:var(--raise);border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:var(--r);padding:14px 14px 12px;margin-top:10px}
.hero .when{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.hero h2{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.02em;line-height:1.02;margin:4px 0 4px}
.hero .where{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin:0 0 6px}
.hero p{margin:0;font-size:.95rem}
.dist{font-family:var(--font-mono);font-size:.74rem;color:var(--brass-ink);margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;min-height:40px}
.btn.primary{background:var(--brass);color:#14110a;border-color:var(--brass)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* stop list */
.stops{list-style:none;margin:8px 0 0;padding:0}
.stop{display:grid;grid-template-columns:56px 1fr auto;gap:0 10px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:start}
.stop .t{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.stop .t small{display:block;font-size:.6rem;letter-spacing:.1em;opacity:.8}
.stop h3{font-size:1.02rem;font-weight:600;line-height:1.25}
.stop .where{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.stop .more{display:none;margin-top:6px;font-size:.92rem}
.stop.open .more{display:block}
.stop .tick{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:1rem;color:var(--muted)}
.stop.done h3{text-decoration:line-through;color:var(--muted)}
.stop.done .tick{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stop.skipped h3{text-decoration:line-through;color:var(--muted)}
.stop.skipped .tick{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.stop.next h3::before{content:"▸ ";color:var(--brass)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:.15em;white-space:nowrap}
.tag.booked{background:var(--ok-soft);color:var(--ok)} .tag.book{background:var(--brass-soft);color:var(--brass-ink)} .tag.walk{border:1px solid var(--rule);color:var(--muted)} .tag.custom{background:var(--brass);color:#14110a}
.dress{font-family:var(--font-mono);font-size:.68rem;color:var(--brass);display:block;margin-top:4px}

/* explore */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin-top:8px}
.card h3{font-size:1.02rem;font-weight:600}
.card .why{font-size:.92rem;margin:3px 0 0}
.card .meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ask{background:var(--raise);border:1px solid var(--brass-soft);border-radius:var(--r);padding:12px;margin-top:12px}
.ask textarea{width:100%;min-height:64px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px;font:inherit;font-size:.95rem;resize:vertical}
.ask .out{margin-top:10px;font-size:.95rem;white-space:pre-wrap}
.ask .out .card{margin-top:8px}
.note{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:8px;line-height:1.5}

/* book */
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.when{font-family:var(--font-mono);font-size:.72rem;white-space:nowrap;color:var(--brass-ink)}
td.chk{width:36px}
tr.done td{color:var(--muted);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:10px}
.facts div{background:var(--surface);padding:10px 12px}
.facts small{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600}
.facts span{display:block;font-size:.85rem;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--rule);display:flex;z-index:7}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs button .ico{font-family:var(--font-display);font-size:1.35rem;letter-spacing:.02em;line-height:1}
.tabs button.on{color:var(--brass-ink)} .tabs button.on .ico{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:.74rem;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8}
.toast.show{opacity:1}
.sync{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function place(id){ if(!id) return null; const p=PLACES[id]; return p?{id,...p}:null; }
function fmtT(t,tz){ if(!/^\d\d:\d\d$/.test(t)) return t; let [h,m]=t.split(':').map(Number); const ap=h>=12?'p':'a'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')}${ap}${tz?' '+tz:''}`; }
function mins(t){ const [h,m]=t.split(':').map(Number); return (h<5?h+24:h)*60+m; } // 00:30 counts as late night of same day
let here=null; // {lat,lng,at}
function km(a,b){ const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function distStr(ll){ if(!here||!ll) return ''; const d=km([here.lat,here.lng],ll); const mi=d*0.621; const walk=Math.round(d/5*60); return mi<0.1?'right here':`${mi.toFixed(1)} mi · ${walk<60?walk+' min walk':'take a car'}`; }
function mapBtns(p,cls=''){
  if(!p||!p.ll) return '';
  const [la,ln]=p.ll, q=encodeURIComponent(p.name), addr=encodeURIComponent(p.addr);
  return `<a class="btn ${cls}" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${la},${ln}&dirflg=w&q=${q}">Directions</a>
  <a class="btn ${cls}" target="_blank" rel="noopener" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]=${la}&dropoff[longitude]=${ln}&dropoff[nickname]=${q}&dropoff[formatted_address]=${addr}">Uber</a>`;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function nowCT(){ const d=new Date(); const p=new Intl.DateTimeFormat('en-US',{timeZone:TRIP.tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(d); const o={}; p.forEach(x=>o[x.type]=x.value); return {date:`${o.year}-${o.month}-${o.day}`,hm:`${o.hour==='24'?'00':o.hour}:${o.minute}`,wd:o.weekday}; }
function tripDayIndex(){ const n=nowCT(); let i=DAYS.findIndex(d=>d.date===n.date); if(i<0){ // before 5am, still "last night"
  const prev=DAYS.findIndex(d=>{const dt=new Date(d.date+'T00:00:00'); dt.setDate(dt.getDate()+1); return dt.toISOString().slice(0,10)===n.date;}); if(prev>=0 && mins(n.hm)<5*60+24*60 && n.hm<'05:00') i=prev; }
  return i; }
function allStops(day){ const base=day.stops.map((s,i)=>({...s,key:`${day.id}:${i}`})); const extra=state.custom.filter(c=>c.day===day.id).map(c=>({...c,key:c.id,custom:true})); return base.concat(extra).sort((a,b)=>mins(a.t)-mins(b.t)); }
function stopState(k){ return state.done[k]?'done':state.skipped[k]?'skipped':''; }

// ---------- views ----------
let curDay = (()=>{ const i=tripDayIndex(); return i>=0?DAYS[i].id:DAYS[0].id; })();
let curCat='all', view='now';

function stopHTML(s,isNext){
  const p=place(s.p); const st=stopState(s.key);
  return `<li class="stop ${st} ${isNext?'next':''}" data-k="${esc(s.key)}">
    <div class="t">${fmtT(s.t)}${s.tz?`<small>${s.tz}</small>`:''}</div>
    <div class="body">
      <h3>${esc(s.title)}${s.status?`<span class="tag ${s.status}">${s.status==='booked'?'Booked':s.status==='book'?'Book':'Walk in'}</span>`:''}${s.custom?'<span class="tag custom">Added</span>':''}</h3>
      <div class="where">${p?esc(p.addr.replace(/, New Orleans.*$/,'')) + ' · ':''}${esc(s.where||'')}${here&&p?` · <b>${distStr(p.ll)}</b>`:''}</div>
      <div class="more">${esc(s.note||'')}${s.dress?`<span class="dress">${esc(s.dress)}</span>`:''}
        <div class="actions">${mapBtns(p)}${s.link?`<a class="btn" target="_blank" rel="noopener" href="${esc(s.link)}">Book / site</a>`:''}${s.alt&&place(s.alt)?`<button class="btn" data-alt="${esc(s.alt)}">Alt: ${esc(place(s.alt).name)}</button>`:''}${st?`<button class="btn" data-undo="${esc(s.key)}">Undo</button>`:`<button class="btn skip" data-skip="${esc(s.key)}">Skip</button>`}${s.custom?`<button class="btn" data-del="${esc(s.key)}">Remove</button>`:''}</div>
      </div>
    </div>
    <button class="tick" data-done="${esc(s.key)}" aria-label="Mark done">${st==='done'?'✓':st==='skipped'?'–':''}</button>
  </li>`;
}
function nextStop(day){ const n=nowCT(); const live = n.date===day.date || tripDayIndex()>=0 && DAYS[tripDayIndex()].id===day.id; const list=allStops(day).filter(s=>!stopState(s.key)); if(!live) return list[0]; return list.find(s=>mins(s.t)+45>=mins(n.hm))||list[list.length-1]; }

function renderNow(){
  const day=DAYS.find(d=>d.id===curDay); const n=nowCT(); const ti=tripDayIndex();
  const nx=nextStop(day); const p=nx?place(nx.p):null;
  let head='';
  if(ti<0){ const d0=new Date(DAYS[0].date+'T12:00:00'), dd=Math.ceil((d0-new Date())/864e5); head=`<p class="eyebrow">${dd>0?`Trip starts in ${dd} day${dd===1?'':'s'}`:'Trip is over — nice work'} · showing ${day.label}</p>`; }
  else head=`<p class="eyebrow">${day.label} · ${day.sub}</p>`;
  const stay=place(day.stay);
  $('#v-now').innerHTML = head + (nx?`
    <div class="hero">
      <div class="when"><span>UP NEXT · ${fmtT(nx.t,nx.tz)}</span><span>${CAT[nx.cat]||''}</span></div>
      <h2>${esc(nx.title)}</h2>
      <div class="where">${[p?esc(p.addr):'',nx.where?esc(nx.where):''].filter(Boolean).join(' · ')}</div>
      <p>${esc(nx.note||'')}</p>
      ${nx.dress?`<span class="dress">${esc(nx.dress)}</span>`:''}
      ${p&&here?`<div class="dist">${distStr(p.ll)} from you</div>`:''}
      <div class="actions">${mapBtns(p,'primary')}${nx.link?`<a class="btn" target="_blank" rel="noopener" href="${esc(nx.link)}">Book / site</a>`:''}<button class="btn ok" data-done="${esc(nx.key)}">Done ✓</button><button class="btn skip" data-skip="${esc(nx.key)}">Skip</button></div>
    </div>`:`<div class="hero"><h2>Nothing left today</h2><p>Everything's ticked. Go find something in the GO tab.</p></div>`) +
  `<div class="row"><button class="btn" id="locate">${here?'Update my location':'Where am I?'}</button>${stay?`<a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${stay.ll[0]},${stay.ll[1]}&dirflg=w">Back to ${esc(stay.name.split(' Hotel')[0].split(',')[0])}</a>`:''}<button class="btn" id="sharestate">Share my check-offs</button></div>
  <h2 class="h2">Rest of ${day.label}</h2>
  <ul class="stops">${allStops(day).map(s=>stopHTML(s,nx&&s.key===nx.key)).join('')}</ul>`;
}
function renderPlan(){
  const day=DAYS.find(d=>d.id===curDay);
  $('#v-plan').innerHTML=`<div class="chips">${DAYS.map(d=>`<button class="chip ${d.id===curDay?'on':''}" data-day="${d.id}"><b>${d.label.slice(0,3)}</b>${d.date.slice(8)}</button>`).join('')}</div>
  <h2 class="h2">${day.label} <span style="font-family:var(--font-mono);font-size:.7rem;color:var(--brass);letter-spacing:.15em">NOV ${Number(day.date.slice(8))}</span></h2><p class="sub">${esc(day.sub)}</p>
  <ul class="stops">${allStops(day).map(s=>stopHTML(s,false)).join('')}</ul>
  <p class="note">Tap a stop for details and directions. Tick = done, Skip keeps it but greys it out. Things you add from the GO tab land here.</p>`;
}
function renderExplore(){
  const cats=['all','food','bar','music','see','event'];
  let list=EXTRAS.map(e=>({...e,pl:place(e.p)})).filter(e=>curCat==='all'||e.cat===curCat);
  if(here) list.sort((a,b)=>km([here.lat,here.lng],a.pl.ll)-km([here.lat,here.lng],b.pl.ll));
  const q=here?`${here.lat},${here.lng}`:'New Orleans, LA';
  $('#v-explore').innerHTML=`<h2 class="h2">Find something else</h2><p class="sub">The vetted backups, ${here?'sorted by distance from you':'unsorted until you share your location'}.</p>
  <div class="row"><button class="btn" id="locate2">${here?'Update location':'Where am I?'}</button>
   <a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?q=live+music${here?`&sll=${q}&z=15`:'+New+Orleans'}">Live music near me</a>
   <a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?q=restaurants${here?`&sll=${q}&z=15`:'+New+Orleans'}">Food near me</a>
   <a class="btn" target="_blank" rel="noopener" href="https://www.wwoz.org/calendar/livewire-music">WWOZ Livewire</a></div>
  <div class="ask"><p class="eyebrow">Ask for ideas</p><textarea id="askq" placeholder="e.g. somewhere for a drink with live blues within 10 minutes, or a late lunch that isn't seafood">${esc(askDefault())}</textarea>
   <div class="row"><button class="btn primary" id="askgo">Build the question</button></div><div class="out" id="askout"></div>
   <p class="note"></p></div>
  <div class="cats">${cats.map(c=>`<button class="chip ${c===curCat?'on':''}" data-cat="${c}">${c==='all'?'All':CAT[c]}</button>`).join('')}</div>
  ${list.map(e=>`<div class="card"><h3>${esc(e.title)} <span class="tag walk">${CAT[e.cat]}</span></h3><p class="why">${esc(e.why)}</p><div class="meta">${esc(e.pl.addr.replace(/, New Orleans.*$/,''))}${here?' · <b>'+distStr(e.pl.ll)+'</b>':''}</div><div class="row">${mapBtns(e.pl)}<button class="btn" data-add="${e.p}" data-title="${esc(e.title)}" data-cat="${e.cat}">+ Add to today</button></div></div>`).join('')}`;
}
function askDefault(){ const n=nowCT(); const h=Number(n.hm.slice(0,2)); return h<11?'Somewhere good for breakfast or coffee nearby':h<15?'A lunch spot nearby that isn\'t seafood':h<18?'Something interesting to do for the next two hours':'Live music nearby that isn\'t jazz, or a bar worth the walk'; }
function renderBook(){
  $('#v-book').innerHTML=`<h2 class="h2">Booking queue</h2><p class="sub">Sorted by the day to act. Everything opens online.</p>
  <table><tbody>${QUEUE.map((r,i)=>`<tr class="${state.queueDone[i]?'done':''}"><td class="chk"><button class="tick" style="width:30px;height:30px" data-q="${i}">${state.queueDone[i]?'✓':''}</button></td><td class="when">${esc(r[0])}</td><td><b>${esc(r[1])}</b><br><span style="font-family:var(--font-mono);font-size:.72rem;color:var(--muted)">${esc(r[2])}</span><br><span style="font-size:.85rem">${esc(r[3])}</span></td></tr>`).join('')}</tbody></table>`;
}
function renderInfo(){
  $('#v-info').innerHTML=`<h2 class="h2">${TRIP.title}</h2><p class="sub">${TRIP.dates}</p>
  <div class="facts">${TRIP.facts.map(f=>`<div><small>${esc(f[0])}</small><b>${esc(f[1])}</b><span>${esc(f[2])}</span></div>`).join('')}</div>
  <h2 class="h2">Every address</h2>
  ${Object.entries(PLACES).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([id,p])=>`<div class="stop" style="grid-template-columns:1fr auto"><div class="body"><h3 style="font-size:.95rem">${esc(p.name)}</h3><div class="where">${esc(p.addr)}</div></div><a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${p.ll[0]},${p.ll[1]}&dirflg=w">Go</a></div>`).join('')}
  <p class="note">Built Sept 2026 from the trip workbook. Runs entirely on this phone. “Share my check-offs” on the NOW tab pushes your ticks to the other phone.</p>`;
}
function renderAll(){ renderNow(); renderPlan(); renderExplore(); renderBook(); renderInfo(); }
function tick(){ const n=nowCT(); $('#clock').innerHTML=`${n.wd} ${fmtT(n.hm)} CT<br>${here?'located '+Math.round((Date.now()-here.at)/60000)+' min ago':'not located'}`; }

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a'); if(!b) return;
  if(b.dataset.v){ view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('section.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+view)); window.scrollTo(0,0); return; }
  if(b.dataset.day){ curDay=b.dataset.day; renderPlan(); renderNow(); return; }
  if(b.dataset.cat){ curCat=b.dataset.cat; renderExplore(); return; }
  if(b.dataset.done!==undefined){ const k=b.dataset.done; if(state.done[k]){delete state.done[k];} else {state.done[k]=true; delete state.skipped[k];} persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.skip!==undefined){ state.skipped[b.dataset.skip]=true; delete state.done[b.dataset.skip]; persist(); renderNow(); renderPlan(); toast('Skipped'); return; }
  if(b.dataset.undo!==undefined){ delete state.done[b.dataset.undo]; delete state.skipped[b.dataset.undo]; persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.del!==undefined){ state.custom=state.custom.filter(c=>c.id!==b.dataset.del); persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.q!==undefined){ const i=b.dataset.q; state.queueDone[i]=!state.queueDone[i]; persist(); renderBook(); return; }
  if(b.dataset.alt){ const p=place(b.dataset.alt); const ex=EXTRAS.find(x=>x.p===b.dataset.alt); toast(p.name); addCustom(b.dataset.alt,p.name,ex?ex.cat:'see',ex?ex.why:''); return; }
  if(b.dataset.add){ addCustom(b.dataset.add,b.dataset.title,b.dataset.cat,EXTRAS.find(x=>x.p===b.dataset.add)?.why||''); return; }
  if(b.id==='locate'||b.id==='locate2'){ locate(); return; }
  if(b.id==='askgo'){ ask(); return; }
  if(b.id==='sharestate'){ shareState(); return; }
});
document.addEventListener('click',e=>{ const li=e.target.closest('li.stop'); if(li && !e.target.closest('button,a')) li.classList.toggle('open'); });
function addCustom(pid,title,cat,why){
  const n=nowCT(); const ti=tripDayIndex(); const day=ti>=0?DAYS[ti].id:curDay;
  const t = ti>=0 ? n.hm : '12:00';
  const p=place(pid);
  state.custom.push({id:'c'+Date.now(),day,t,p:pid,title,cat,where:p?p.addr.replace(/, New Orleans.*$/,''):'',note:why,status:'walk'});
  persist(); curDay=day; renderNow(); renderPlan(); toast('Added to '+DAYS.find(d=>d.id===day).label);
}
function locate(){
  if(!navigator.geolocation){ toast('No location on this browser'); return; }
  toast('Locating…');
  navigator.geolocation.getCurrentPosition(pos=>{ here={lat:pos.coords.latitude,lng:pos.coords.longitude,at:Date.now()}; renderAll(); tick(); toast('Located'); },()=>toast('Location blocked — check browser settings'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
async function shareState(){
  const enc=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const url=location.origin+location.pathname+'#s='+enc;
  try{ if(navigator.share){ await navigator.share({title:'NOLA Pocket',text:'Open to sync my check-offs: '+url}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(url); toast('Link copied — text it over'); }catch(e){ prompt('Copy this link',url); }
}
function ask(){
  const out=$('#askout'); const q=$('#askq').value.trim(); if(!q) return;
  const n=nowCT(); const ti=tripDayIndex(); const day=DAYS.find(d=>d.id===(ti>=0?DAYS[ti].id:curDay));
  const planned=allStops(day).map(s=>`${fmtT(s.t)} ${s.title}${stopState(s.key)?' ('+stopState(s.key)+')':''}`).join('; ');
  const nearest = here ? Object.values(PLACES).map(p=>({p,d:km([here.lat,here.lng],p.ll)})).sort((a,b)=>a.d-b.d)[0].p.name : null;
  const stay=place(day.stay);
  const prompt=`You are a sharp New Orleans local acting as concierge for a couple, Noel and Malinda, visiting Nov 5–10, 2026. Right now it is ${n.wd} ${fmtT(n.hm)} Central${ti<0?' (planning ahead for '+day.label+')':''}. ${here?`We are at about ${here.lat.toFixed(4)}, ${here.lng.toFixed(4)} (near ${nearest}).`:`Our hotel is ${stay?stay.name+', '+stay.addr:'in the CBD'}.`}
Rules: Noel does not eat seafood (needs solid non-seafood mains). Noel does not like jazz; Malinda does — prefer blues, funk, brass band, rock, dueling pianos or zydeco, and flag anything that is jazz. No phone-only reservations. Walking distance or a short rideshare. No Bourbon Street tourist traps unless asked.
Already planned today (don't repeat): ${planned}.
Request: ${q}
Give 4 to 6 specific options with street address, why, rough cost, hours if known, and whether it's jazz.`;
  const enc=encodeURIComponent(prompt);
  out.innerHTML=`<div class="row"><a class="btn primary" target="_blank" rel="noopener" href="https://claude.ai/new?q=${enc}">Ask in Claude</a><a class="btn" target="_blank" rel="noopener" href="https://chatgpt.com/?q=${enc}">Ask in ChatGPT</a><a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?q=${encodeURIComponent(q)}${here?`&sll=${here.lat},${here.lng}&z=15`:'+New+Orleans'}">Search Apple Maps</a></div><p class="note">Opens your question — date, time, location, today's plan and the house rules already filled in — in whichever app you have.</p>`;
}
renderAll(); tick(); setInterval(tick,30000); setInterval(()=>{ if(view==='now') renderNow(); },120000);
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
