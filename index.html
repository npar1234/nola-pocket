<html lang="en">
<head>

<style>
:root{
  --bg:#f1ece1; --surface:#faf7f0; --raise:#ffffff; --ink:#1b1922; --muted:#6c675b; --rule:#d9d1bf;
  --brass:#8d6a1b; --brass-soft:#ead9ae; --brass-ink:#5a4310; --ok:#2e5d3a; --ok-soft:#d3e5d4; --skip:#8a3a2e; --skip-soft:#efd6d0;
  --font-display:'Bebas Neue','Oswald','Impact',sans-serif; --font-body:'Instrument Sans','Helvetica Neue',sans-serif; --font-mono:'DM Mono',Menlo,monospace;
  --r:10px; --tab-h:64px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}}
:root[data-theme="dark"]{
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.45;padding-inline:16px;padding-block:0 calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--brass-ink)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:normal}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:10px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule)}
.top h1{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.03em;line-height:1}
.top h1 em{font-style:normal;color:var(--brass)}
.top .clock{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.3}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 4px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:6px 11px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--brass-soft);color:var(--brass-ink);border-color:var(--brass-soft)}
.chip b{font-family:var(--font-display);font-size:1rem;letter-spacing:.04em;margin-right:4px;color:inherit;font-weight:normal}
section.view{display:none;padding-top:6px} section.view.on{display:block}
.eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.h2{font-family:var(--font-display);font-size:2rem;letter-spacing:.02em;line-height:1;margin:14px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-style:italic}

/* hero (up next) */
.hero{background:var(--raise);border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:var(--r);padding:14px 14px 12px;margin-top:10px}
.hero .when{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.hero h2{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.02em;line-height:1.02;margin:4px 0 4px}
.hero .where{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin:0 0 6px}
.hero p{margin:0;font-size:.95rem}
.dist{font-family:var(--font-mono);font-size:.74rem;color:var(--brass-ink);margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;min-height:40px}
.btn.primary{background:var(--brass);color:#14110a;border-color:var(--brass)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* stop list */
.stops{list-style:none;margin:8px 0 0;padding:0}
.stop{display:grid;grid-template-columns:56px 1fr auto;gap:0 10px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:start}
.stop .t{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.stop .t small{display:block;font-size:.6rem;letter-spacing:.1em;opacity:.8}
.stop h3{font-size:1.02rem;font-weight:600;line-height:1.25}
.stop .where{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.stop .more{display:none;margin-top:6px;font-size:.92rem}
.stop.open .more{display:block}
.stop .tick{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:1rem;color:var(--muted)}
.stop.done h3{text-decoration:line-through;color:var(--muted)}
.stop.done .tick{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stop.skipped h3{text-decoration:line-through;color:var(--muted)}
.stop.skipped .tick{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.stop.next h3::before{content:"▸ ";color:var(--brass)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:.15em;white-space:nowrap}
.tag.booked{background:var(--ok-soft);color:var(--ok)} .tag.book{background:var(--brass-soft);color:var(--brass-ink)} .tag.walk{border:1px solid var(--rule);color:var(--muted)} .tag.custom{background:var(--brass);color:#14110a}
.dress{font-family:var(--font-mono);font-size:.68rem;color:var(--brass);display:block;margin-top:4px}

/* explore */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin-top:8px}
.card h3{font-size:1.02rem;font-weight:600}
.card .why{font-size:.92rem;margin:3px 0 0}
.card .meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ask{background:var(--raise);border:1px solid var(--brass-soft);border-radius:var(--r);padding:12px;margin-top:12px}
.ask textarea{width:100%;min-height:64px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px;font:inherit;font-size:.95rem;resize:vertical}
.ask .out{margin-top:10px;font-size:.95rem;white-space:pre-wrap}
.ask .out .card{margin-top:8px}
.note{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:8px;line-height:1.5}

/* book */
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.when{font-family:var(--font-mono);font-size:.72rem;white-space:nowrap;color:var(--brass-ink)}
td.chk{width:36px}
tr.done td{color:var(--muted);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:10px}
.facts div{background:var(--surface);padding:10px 12px}
.facts small{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600}
.facts span{display:block;font-size:.85rem;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--rule);display:flex;z-index:7}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs button .ico{font-family:var(--font-display);font-size:1.35rem;letter-spacing:.02em;line-height:1}
.tabs button.on{color:var(--brass-ink)} .tabs button.on .ico{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:.74rem;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8}
.toast.show{opacity:1}
.sync{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<section class="view" id="v-plan"></section>

<script>
// ---- Trip data. Times are Central. `p` keys into PLACES for address + coordinates.
const TRIP = {
  title: "New Orleans", dates: "Thu Nov 5 – Tue Nov 10, 2026", tz: "America/Chicago",
  facts: [
    ["Nights 1–3", "NOPSI Hotel", "317 Baronne · conf 75045SG423265 · Deluxe King · $50 hotel + breakfast credits"],
    ["Nights 4–5", "Virgin Hotels", "550 Baronne · The Edit: breakfast for two, late checkout"],
    ["Flights", "Southwest nonstop", "Conf CFX3RD · LAS 7:40a → MSY 1:00p Thu · MSY back Tue · A-List: check 48h out"],
    ["Airport", "Taxi $36 flat", "Baggage Claim Level 1, Door 7 · use Lyft not Uber ($10/mo card credit + 5x points) off-peak"],
    ["Card", "Chase Sapphire Reserve", "Pay Virgin charges in cash (no points) so both $250 credits fire"],
    ["Rules", "No seafood · no phone calls", "Every reservation on this list books online"],
  ],
};

// status: booked | book | walk
const DAYS = [
  { id:"thu", label:"Thursday", date:"2026-11-05", sub:"Land at one, a muffuletta by the river, the rooftop, then the first big night.", stay:"nopsi", stops:[
    { t:"07:40", tz:"PT", p:null, title:"LAS \u2192 MSY, Southwest", status:"booked", cat:"transit", where:"Conf CFX3RD \u00b7 nonstop \u00b7 in at 1:00pm", note:"Early one \u2014 out the door around 6. Check the app 48 hours before: A-List gets Extra Legroom free if a row is open." },
    { t:"13:00", p:"msy", title:"Land MSY", cat:"transit", where:"Taxi $36 flat (Level 1, Door 7) \u00b7 20\u201330 min \u00b7 use Lyft not Uber ($10/mo card credit + 5x points)", note:"Whole afternoon ahead. Dark by 5, so the outdoor part goes first." },
    { t:"13:45", p:"nopsi", title:"Drop bags at NOPSI \u2014 and make the ask now", status:"booked", cat:"hotel", key:true, where:"Conf 75045SG423265 \u00b7 Deluxe King, 374\u2013498 sq ft \u00b7 rooms ready at 4", note:"The 1927 New Orleans Public Service headquarters \u2014 nine stories, Art Deco, built around daylight. Every room here faces outward, so there is no bad room to get stuck in. At bag drop say it\u2019s Malinda\u2019s 50th and ask for a high floor away from Baronne. Your rate carries a $50 hotel credit and $20/person breakfast credit daily \u2014 use them." },
    { t:"14:30", p:"central", title:"Muffuletta at Central Grocery, eaten on the river", status:"walk", cat:"food", key:true, where:"923 Decatur \u00b7 ~20-min walk through the Quarter", note:"Since 1906, and the sandwich was invented there. Get a half between you \u2014 a whole feeds three \u2014 and carry it across Decatur to the Moon Walk to eat looking at the Mississippi. This is also your orientation walk." },
    { t:"16:00", p:null, title:"Walk back up Royal Street", status:"walk", cat:"see", where:"Galleries, antique shops, street musicians \u00b7 ~25 min at a browse", note:"Royal is the Quarter\u2019s handsome street \u2014 cast iron, art, no daiquiri shops. Ends you a few blocks from the hotel." },
    { t:"17:00", p:"nopsi", title:"Check in properly", cat:"hotel", where:"Unpack, shower, reset", note:"If the desk didn\u2019t place you at bag drop, ask again \u2014 shift change means a different person." },
    { t:"17:45", p:"nopsi", title:"Drink at Above the Grid, the rooftop", status:"walk", cat:"bar", key:true, where:"Top of the hotel \u00b7 pool deck \u00b7 skyline and Superdome views", note:"Elevator, not a walk. First drink of the trip with the city laid out in front of you \u2014 worth doing on the night you arrive rather than saving it." },
    { t:"19:00", p:"cochon", title:"Dinner at Cochon", status:"book", cat:"food", key:true, where:"930 Tchoupitoulas \u00b7 ~20-min walk or a 5-min Lyft", note:"Cajun pork: cochon de lait, boudin, smoked ham hock, rabbit and dumplings. Best non-seafood table in the city." },
    { t:"20:45", p:"preshall", title:"Preservation Hall", status:"book", cat:"music", key:true, where:"726 St Peter \u00b7 15-min walk \u00b7 35\u201340 min set \u00b7 tickets post ~mid-Oct", note:"Traditional jazz in a room standing since 1750. Malinda\u2019s night. Non-refundable \u2014 grab the 8:45 when November opens." },
    { t:"21:45", p:"lafittes", title:"Lafitte\u2019s Blacksmith Shop", status:"walk", cat:"bar", where:"941 Bourbon \u00b7 8-min walk \u00b7 cash bar \u00b7 piano in the back", note:"1770s brick cottage lit by candles \u2014 the oldest bar building in the country. One drink, then a Lyft home." },
  ]},
  { id:"fri", label:"Friday", date:"2026-11-06", sub:"One old house, one odd museum, then the lunch people plan trips around.", stay:"nopsi", stops:[
    { t:"10:00", p:"hermann", title:"Hermann-Grima House", status:"book", cat:"see", key:true, where:"12-min walk from NOPSI · guided, on the hour · ~45 min · $20", note:"The one house tour: an 1831 mansion, working open-hearth kitchen, stable, courtyard ironwork. Closed Tuesdays.", link:"https://hgghh.org" },
    { t:"11:30", p:"pharmacy", title:"New Orleans Pharmacy Museum", status:"walk", cat:"see", where:"$10 · Tue–Sat 11–4 · 6-min walk · 30–40 min", note:"America's first licensed pharmacy, 1823: leeches, voodoo potions, a carved soda fountain. On the way to Galatoire's." },
    { t:"13:30", p:"galatoires", title:"Galatoire's Friday lunch", status:"book", cat:"food", key:true, where:"Resy ~Oct 7 · 1905 · 8-min walk from NOPSI · closed Mondays", note:"Souffléed potatoes, filet béarnaise, Chicken Clemenceau. Collared shirt and long pants; jackets only matter after 5pm.", dress:"Collared shirt and long pants — no jacket at lunch", link:"https://resy.com" },
    { t:"16:30", p:"napoleon", title:"Napoleon House", status:"walk", cat:"bar", where:"6-min walk · 1797 building · the Pimm's Cup", note:"Peeling walls, classical music, the balcony meant for Napoleon. Let a three-hour lunch settle." },
    { t:"19:30", p:"dooky", title:"Dooky Chase's", status:"book", cat:"food", key:true, where:"OpenTable ~Oct 7 · dinner Fri & Sat only · $12 Lyft", note:"Leah Chase's Creole institution since 1941 — fried chicken, gumbo, red beans, the art on the walls.", link:"https://www.opentable.com" },
    { t:"21:30", p:"chickie", title:"Eric Lindell at Chickie Wah Wah", status:"book", cat:"music", key:true, where:"6-min Lyft from Dooky Chase · small room · swamp blues", note:"Noel's night: Louisiana blue-eyed soul, a guitar player's guitar player. Malinda's alternative: Kermit Ruffins at Blue Nile, 10pm.", link:"https://www.chickiewahwah.com", alt:"bluenile" },
    { t:"23:30", p:"washsq", title:"Bayou Bacchanal Pre Fete (optional)", status:"walk", cat:"event", where:"Wear white · Marigny", note:"Only if you're still standing." },
  ]},
  { id:"sat", label:"Saturday", date:"2026-11-07", sub:"The celebration day. Something on fire at both ends of it.", stay:"nopsi", stops:[
    { t:"10:15", p:"brennans", title:"Brennan's", status:"booked", cat:"food", key:true, where:"417 Royal · 12-min walk from NOPSI · the pink building · out by ~noon", note:"Eggs Hussarde, turtle soup (veal), Bananas Foster flambéed tableside — invented here in 1951. PAY WITH THE SAPPHIRE RESERVE: Brennan’s is the only restaurant on this trip in Chase’s Exclusive Tables program, and you have $150 of dining credit unused and expiring Dec 31. This one meal captures all of it.", dress:"Collared shirt, long pants, closed shoes" },
    { t:"12:15", p:"voodooauth", title:"Voodoo Authentica", status:"walk", cat:"see", key:true, where:"12-min walk · run by initiated practitioners since 1996", note:"Gris-gris made to order at the counter — say what it's for. Readings in the back. The Historic Voodoo Museum is a block up ($10) if you want more.", alt:"voodoomuseum" },
    { t:"13:15", p:"washsq", title:"Bayou Bacchanal", status:"walk", cat:"event", where:"Festival ~11am–9pm · route posts ~1 wk out · 20-min walk from Dumaine", note:"Caribbean masquerade parade into a festival — costumes, soca, jerk everything. Check friendsofculture.org late October. Fallback: Beignet Fest, City Park.", link:"https://friendsofculture.org", alt:"beignetfest" },
    { t:"16:15", p:"basin", title:"St. Louis Cemetery No. 1 \u2014 check in 4:15", status:"booked", cat:"see", key:true, where:"BOOKED \u00b7 ref QJ71G5YY \u00b7 tour 4:30pm, 2 adults, $62.50 \u00b7 ARRIVE 4:15 for wristbands \u00b7 Cemetery Tour Desk, Basin St. Station, 501 Basin St", note:"1789, the oldest in the city, and closed to anyone without a booked tour. Whitewashed for All Saints\u2019 five days ago; Marie Laveau\u2019s tomb is the stop everyone waits for. Sunset is 5:05, so this ends at dusk \u2014 the right light for it. Tours depart promptly, so the 4:15 check-in is not optional. No changes or refunds inside 24 hours. Order NPGKJQ07.", link:"https://cemeterytourneworleans.com" },
    { t:"17:45", p:"nopsi", title:"Back to NOPSI to change", cat:"hotel", where:"14-min walk from Basin St \u00b7 or a $8 Lyft", note:"Antoine\u2019s wants a collared shirt and long pants. Jacket optional \u2014 you don\u2019t need a suit." },
    { t:"19:30", p:"antoines", title:"Antoine's — the birthday dinner", status:"book", cat:"food", key:true, where:"OpenTable ~Oct 8 · since 1840 · fourteen dining rooms", note:"Chateaubriand, Chicken Rochambeau, pommes soufflées. Ask to see the Rex Room and the 1840 Room.", dress:"Collared shirt, long pants, closed shoes — jacket optional", link:"https://www.opentable.com" },
    { t:"21:15", p:"pyrates", title:"Absinthe at Pirates Alley Cafe", status:"walk", cat:"bar", key:true, where:"Beside St. Louis Cathedral · 4-min walk from Antoine's · Sat till 2am", note:"The traditional service: a sugar cube on a slotted spoon, ice water dripped over it until the absinthe clouds. Twenty feet wide, in the alley where Faulkner wrote his first novel. Ask for the drip, not a shot. The famous Old Absinthe House on Bourbon has the historic name and marble fountains but pours like a Bourbon Street bar.", alt:"absinthe" },
    { t:"22:00", p:"patobs", title:"Pat O'Brien's Piano Lounge", status:"walk", cat:"music", key:true, where:"3-min walk from Pirates Alley · dueling pianos Sat 1pm–2am · walk in", note:"Two pianos and a room that shouts every request back. Hurricanes were invented here. Jazz alternative: Snug Harbor, 9:30 seating.", alt:"snug" },
  ]},
  { id:"sun", label:"Sunday", date:"2026-11-08", sub:"Hotel move, jazz brunch, mansions, a festival, a new rooftop.", stay:"virgin", stops:[
    { t:"09:00", p:"virgin", title:"Check out of NOPSI, drop bags at Virgin", status:"booked", cat:"hotel", where:"Two blocks down Baronne · 4-min walk · check-in 4pm · rooftop pool, Commons Club", note:"Then the St. Charles streetcar Uptown — $8 for a 3-day Jazzy Pass." },
    { t:"10:00", p:"commanders", title:"Commander's Palace jazz brunch", status:"book", cat:"food", key:true, where:"Tock — no published window; check weekly from early Oct", note:"A live trio moves table to table. Collared shirt and closed shoes, no jeans; jackets are 'preferred,' not required.", dress:"Collared shirt, closed shoes, no jeans — jacket optional", link:"https://www.exploretock.com/commanderspalace" },
    { t:"12:00", p:"lafayette1", title:"Lafayette Cemetery No. 1, over the wall", status:"walk", cat:"see", where:"Directly across Washington Ave · closed", note:"Two minutes at the gate. Lafayette No. 2 (Washington & Loyola) is open if you want to walk one." },
    { t:"13:00", p:"commanders", title:"Garden District architecture walk", status:"book", cat:"see", key:true, where:"NOLA Tours · $40 pp · 2 hrs · max 14 · meets a few blocks from Commander's", note:"Greek Revival and Italianate mansions under the live oaks. The one architecture walk.", link:"https://nolatours.com" },

<script>
// ---------- state ----------
const LS='nola-pocket-v1';
let state={done:{},skipped:{},custom:[],queueDone:{}};
let db=null, stateDoc=null, syncMode='local';
try{ const s=localStorage.getItem(LS); if(s) state={...state,...JSON.parse(s)}; }catch(e){}
function persist(){
  try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
  if(stateDoc){ stateDoc.set(state).catch(()=>{}); }
}
(async()=>{
  try{
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(!db) return;
    stateDoc = db.doc('trip/state');
    const snap = await stateDoc.get();
    if(snap.exists){ state={...state,...snap.data()}; } else { await stateDoc.set(state); }
    syncMode='shared'; renderAll();
    stateDoc.onSnapshot(s=>{ if(s.exists && !s.metadata.hasPendingWrites){ state={...state,...s.data()}; try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} renderAll(); } });
  }catch(e){}
})();

// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAT={food:'Eat',bar:'Drink',music:'Music',see:'See',event:'Event',hotel:'Hotel',transit:'Travel'};
function place(id){ if(!id) return null; const p=PLACES[id]; return p?{id,...p}:null; }
function fmtT(t,tz){ if(!/^\d\d:\d\d$/.test(t)) return t; let [h,m]=t.split(':').map(Number); const ap=h>=12?'p':'a'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')}${ap}${tz?' '+tz:''}`; }
function mins(t){ const [h,m]=t.split(':').map(Number); return (h<5?h+24:h)*60+m; } // 00:30 counts as late night of same day
let here=null; // {lat,lng,at}
function km(a,b){ const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function distStr(ll){ if(!here||!ll) return ''; const d=km([here.lat,here.lng],ll); const mi=d*0.621; const walk=Math.round(d/5*60); return mi<0.1?'right here':`${mi.toFixed(1)} mi · ${walk<60?walk+' min walk':'take a car'}`; }
function mapBtns(p,cls=''){
  if(!p||!p.ll) return '';
  const [la,ln]=p.ll, q=encodeURIComponent(p.name), addr=encodeURIComponent(p.addr);
  return `<a class="btn ${cls}" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${la},${ln}&dirflg=w&q=${q}">Directions</a>
  <a class="btn ${cls}" target="_blank" rel="noopener" href="https://lyft.com/ride?id=lyft&destination[latitude]=${la}&destination[longitude]=${ln}">Lyft</a>
  <a class="btn ${cls}" target="_blank" rel="noopener" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]=${la}&dropoff[longitude]=${ln}&dropoff[nickname]=${q}&dropoff[formatted_address]=${addr}">Uber</a>`;
}
function menuBtn(pid,cls=''){
  const p=place(pid); if(!p) return '';
  const M = (typeof MENUS!=='undefined') ? MENUS : {};
  const has = Object.prototype.hasOwnProperty.call(M,pid);
  // explicit null = this place publishes no menu online; show nothing rather
  // than a button that dumps you on a homepage or a scraped-menu site.
  if(has && !M[pid]) return '';
  // a MENUS entry wins over category, so a music room with a bar menu gets one
  if(!has && !(p.cat==='food'||p.cat==='bar')) return '';
  const url = has ? M[pid]
    : 'https://www.google.com/search?q='+encodeURIComponent(p.name+' New Orleans menu');
  return `<a class="btn ${cls}" target="_blank" rel="noopener" href="${url}">Menu</a>`;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function nowCT(){ const d=new Date(); const p=new Intl.DateTimeFormat('en-US',{timeZone:TRIP.tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(d); const o={}; p.forEach(x=>o[x.type]=x.value); return {date:`${o.year}-${o.month}-${o.day}`,hm:`${o.hour==='24'?'00':o.hour}:${o.minute}`,wd:o.weekday}; }

  const prev=DAYS.findIndex(d=>{const dt=new Date(d.date+'T00:00:00'); dt.setDate(dt.getDate()+1); return dt.toISOString().slice(0,10)===n.date;}); if(prev>=0 && mins(n.hm)<5*60+24*60 && n.hm<'05:00') i=prev; }
  return i; }
function allStops(day){ const base=day.stops.map((s,i)=>({...s,key:`${day.id}:${i}`})); const extra=state.custom.filter(c=>c.day===day.id).map(c=>({...c,key:c.id,custom:true})); return base.concat(extra).sort((a,b)=>mins(a.t)-mins(b.t)); }
function stopState(k){ return state.done[k]?'done':state.skipped[k]?'skipped':''; }

// ---------- views ----------
let curDay = (()=>{ const i=tripDayIndex(); return i>=0?DAYS[i].id:DAYS[0].id; })();
let curCat='all', view='now'; let onlyWalk=false, onlyOpen=false; let whoFilter='all';


function anchorLine(day){
  const a=allStops(day).filter(s=>s.status==='booked'||s.status==='book');
  const flex=allStops(day).length-a.length;
  if(!a.length) return '<p class="note"><b>Nothing is locked today.</b> Every stop here is a walk-in — reorder or bin any of it.</p>';
  return '<p class="note"><b>Fixed points today:</b> '+a.map(s=>fmtT(s.t)+' '+s.title.split(' \u2014 ')[0]).join(' \u00b7 ')+
    '. The other '+flex+' '+(flex===1?'stop is':'stops are')+' walk-in \u2014 skip, reorder or replace freely from the GO tab.</p>';
}

function stopHTML(s,isNext){
  const p=place(s.p); const st=stopState(s.key);
  return `<li class="stop ${st} ${isNext?'next':''}" data-k="${esc(s.key)}">
    <div class="t">${fmtT(s.t)}${s.tz?`<small>${s.tz}</small>`:''}</div>

      <div class="where">${p?esc(p.addr.replace(/, New Orleans.*$/,'')) + ' · ':''}${esc(s.where||'')}${here&&p?` · <b>${distStr(p.ll)}</b>`:''}</div>

function nextStop(day){ const n=nowCT(); const live = n.date===day.date || tripDayIndex()>=0 && DAYS[tripDayIndex()].id===day.id; const list=allStops(day).filter(s=>!stopState(s.key)); if(!live) return list[0]; return list.find(s=>mins(s.t)+45>=mins(n.hm))||list[list.length-1]; }

const DOW={Su:0,Mo:1,Tu:2,We:3,Th:4,Fr:5,Sa:6};
function openState(oh){                       // -> {open:bool, txt:string} or null when unknown
  if(!oh) return null;
  const n=nowCT(); const wd=DOW[n.wd.slice(0,2)]; const cur=Number(n.hm.slice(0,2))*60+Number(n.hm.slice(3,5));
  let open=false, nextTxt='';
  oh.split(';').forEach(clause=>{
    const m=clause.trim().match(/^([A-Za-z]{2})(?:-([A-Za-z]{2}))?\s+(\d\d):(\d\d)-(\d\d):(\d\d)$/);
    if(!m) return;
    const a=DOW[m[1]], b=m[2]?DOW[m[2]]:a;
    const s1=Number(m[3])*60+Number(m[4]); let e1=Number(m[5])*60+Number(m[6]);
    const overnight=e1<=s1; if(overnight) e1+=1440;
    for(let d=0;d<7;d++){
      const inRange = a<=b ? (d>=a&&d<=b) : (d>=a||d<=b);
      if(!inRange) continue;
      // today's window
      if(d===wd && cur>=s1 && cur<e1) open=true;
      // yesterday's window spilling past midnight
      if(overnight && d===((wd+6)%7) && cur+1440>=s1 && cur+1440<e1) open=true;
      if(d===wd && cur<s1) nextTxt=nextTxt||('opens '+fmtT(m[3]+':'+m[4]));
    }
  });
  return {open, txt: open?'Open now':(nextTxt||'Closed now')};
}

function safe(fn,label){ try{ fn(); }catch(err){ console.error(label,err); const el=document.querySelector('#v-'+label); if(el) el.innerHTML='<h2 class="h2">This view hit an error</h2><p class="sub">'+String(err.message||err)+'</p><p class="note">The other tabs still work. Tell Claude what this says.</p>'; } }

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a'); if(!b) return;
  if(b.dataset.v){ view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('section.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+view)); window.scrollTo(0,0); return; }
  if(b.dataset.day){ curDay=b.dataset.day; renderPlan(); renderNow(); return; }
  if(b.dataset.cat){ curCat=b.dataset.cat; renderExplore(); return; }
  if(b.dataset.f==='walk'){ onlyWalk=!onlyWalk; renderExplore(); return; }
  if(b.dataset.f==='open'){ onlyOpen=!onlyOpen; renderExplore(); return; }
  if(b.dataset.who){ whoFilter=b.dataset.who; renderInfo(); return; }
  if(b.dataset.done!==undefined){ const k=b.dataset.done; if(state.done[k]){delete state.done[k];} else {state.done[k]=true; delete state.skipped[k];} persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.skip!==undefined){ state.skipped[b.dataset.skip]=true; delete state.done[b.dataset.skip]; persist(); renderNow(); renderPlan(); toast('Skipped'); return; }
  if(b.dataset.undo!==undefined){ delete state.done[b.dataset.undo]; delete state.skipped[b.dataset.undo]; persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.del!==undefined){ state.custom=state.custom.filter(c=>c.id!==b.dataset.del); persist(); renderNow(); renderPlan(); return; }
  if(b.dataset.q!==undefined){ const i=b.dataset.q; state.queueDone[i]=!state.queueDone[i]; persist(); renderBook(); return; }
  if(b.dataset.alt){ const p=place(b.dataset.alt); const ex=EXTRAS.find(x=>x.p===b.dataset.alt); toast(p.name); addCustom(b.dataset.alt,p.name,ex?ex.cat:'see',ex?ex.why:''); return; }
  if(b.dataset.add){ addCustom(b.dataset.add,b.dataset.title,b.dataset.cat,EXTRAS.find(x=>x.p===b.dataset.add)?.why||''); return; }
  if(b.id==='locate'||b.id==='locate2'){ locate(); return; }
  if(b.id==='askgo'){ ask(); return; }
  const li=e.target.closest('.stop'); if(li && !b.classList.contains('tick') && !b.href && !b.dataset.skip && !b.dataset.undo){ li.classList.toggle('open'); }
});
document.addEventListener('click',e=>{ const li=e.target.closest('li.stop'); if(li && !e.target.closest('button,a')) li.classList.toggle('open'); });
function addCustom(pid,title,cat,why){
  const n=nowCT(); const ti=tripDayIndex(); const day=ti>=0?DAYS[ti].id:curDay;
  const t = ti>=0 ? n.hm : '12:00';
  const p=place(pid);
  state.custom.push({id:'c'+Date.now(),day,t,p:pid,title,cat,where:p?p.addr.replace(/, New Orleans.*$/,''):'',note:why,status:'walk'});
  persist(); curDay=day; renderNow(); renderPlan(); toast('Added to '+DAYS.find(d=>d.id===day).label);
}
function locate(){
  if(!navigator.geolocation){ toast('No location on this browser'); return; }
  toast('Locating…');
  navigator.geolocation.getCurrentPosition(pos=>{ here={lat:pos.coords.latitude,lng:pos.coords.longitude,at:Date.now()}; renderAll(); tick(); toast('Located'); },()=>toast('Location blocked — check browser settings'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
async function ask(){
  const out=$('#askout'), stat=$('#askstat'); const q=$('#askq').value.trim(); if(!q) return;
  stat.textContent='thinking…'; out.textContent='';
  const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
  if(!sample){ stat.textContent=''; out.innerHTML='<p>Asking isn\'t available in this view — use the map searches above.</p>'; return; }
  const n=nowCT(); const ti=tripDayIndex(); const day=DAYS.find(d=>d.id===(ti>=0?DAYS[ti].id:curDay));
  const planned=allStops(day).map(s=>`${fmtT(s.t)} ${s.title}${stopState(s.key)?' ('+stopState(s.key)+')':''}`).join('; ');
  const nearest = here ? Object.values(PLACES).map(p=>({p,d:km([here.lat,here.lng],p.ll)})).sort((a,b)=>a.d-b.d)[0].p.name : null;
  const stay=place(day.stay);
  const prompt=`You are a sharp New Orleans local acting as concierge for a couple, Noel and Malinda, visiting Nov 5–10, 2026. Right now it is ${n.wd} ${fmtT(n.hm)} Central${ti<0?' (they are planning ahead; assume they will be in the city on '+day.label+')':''}. ${here?`They are at approximately ${here.lat.toFixed(4)}, ${here.lng.toFixed(4)} (near ${nearest}).`:`Their hotel is ${stay?stay.name+', '+stay.addr:'in the CBD'}.`}
Hard rules: Noel does not eat seafood (a place must have solid non-seafood mains). Noel does not like jazz; Malinda does — prefer blues, funk, brass-band, rock, dueling pianos, zydeco, or note clearly when something is jazz. Both like dueling pianos and blues. No phone-only reservations. Prefer walking distance or a short rideshare. Avoid Bourbon Street tourist traps unless the request is explicitly for that.
Already planned today (don't repeat these): ${planned}.
Request: ${q}
Reply with ONLY a JSON array of 4 to 6 objects: {"name":"","address":"street address, New Orleans","why":"one or two specific sentences","cost":"$ / $$ / $$$ or a price","when":"hours or best time, if known","kind":"food|bar|music|see|event"}. If unsure about hours, say "check hours". No prose outside the JSON.`;
  try{
    const res = await sample.json(prompt,{modelTier:'default',cache:false});
    const arr = Array.isArray(res)?res:(res.results||res.items||[]);
    if(!arr.length) throw new Error('empty');
    out.innerHTML = arr.map(r=>`<div class="card"><h3>${esc(r.name)} <span class="tag walk">${esc(r.kind||'')}</span></h3><p class="why">${esc(r.why)}</p><div class="meta">${esc(r.address||'')}${r.cost?' · '+esc(r.cost):''}${r.when?' · '+esc(r.when):''}</div><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://maps.apple.com/?q=${encodeURIComponent((r.name||'')+' '+(r.address||''))}">Open in Maps</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent((r.name||'')+' New Orleans hours')}">Check hours</a></div></div>`).join('') + `<p class="note">Suggestions are Claude's from memory — verify hours before you walk.</p>`;
    stat.textContent='';
  }catch(err){ stat.textContent=''; out.innerHTML=`<p>${err&&err.code==='not_granted'?'Asking was declined for this page.':err&&err.code==='rate_limited'?'Too many asks — wait a minute.':'Couldn\'t get suggestions just now — try the map searches above.'}</p>`; }
}
renderAll(); tick(); setInterval(tick,30000); setInterval(()=>{ if(view==='now') renderNow(); },120000);
